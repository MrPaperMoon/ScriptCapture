<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <title>Watch Together</title>
</head>

<body>
    <header><span class="logo"><img src="icons/smart-display.svg" width="24" height="24" alt=""></span>
        <div>
            <h1>Watch Together</h1><small>Инструмент совместного просмотра фильмов</small>
        </div>
    </header>
    <section id="setup"><label id="link-label" for="link">Комната подключения</label><input id="link" type="url"
            placeholder="code.avito.ru/r/***">
        <button id="join">Присоединиться</button>
        <button id="create" class="secondary">Создать сессию</button>
    </section>
    <button id="copy" class="secondary" hidden>Скопировать ссылку</button>
    <p id="roomNote"></p>
    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>
    <section id="ready" hidden>
        <h2>Подключение установлено</h2>
        <div id="call-video" hidden>
            <video id="remote-video" autoplay muted playsinline aria-label="Камера собеседника"></video>
            <p id="no-video-signal" role="status">Нет видеосигнала от собеседника</p>
        </div>
        <div class="call-controls" role="group" aria-label="Управление звонком">
            <div class="call-inputs">
                <button id="microphone" type="button" aria-label="Микрофон" aria-pressed="false"><img width="24" height="24" src="icons/mic_off.svg" alt=""></button>
                <button id="camera" type="button" aria-label="Камера" aria-pressed="false"><img width="24" height="24" src="icons/camera_video_off.svg" alt=""></button>
            </div>
            <button id="speaker" type="button" aria-label="Звук собеседника" aria-pressed="true"><img width="24" height="24" src="icons/volume_up.svg" alt=""></button>
        </div>
        <button id="capture">Capture on site</button>
        <button id="pause" hidden>Приостановить стриминг</button>
        <p id="site"></p>
    </section>
    <button id="disconnect" class="secondary" hidden>Отключиться</button>
    <script type="module" src="popup.js"></script>
</body>

</html>
